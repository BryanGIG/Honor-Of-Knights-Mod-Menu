apply plugin: 'com.android.application'

android {
    compileSdk 33
    namespace 'com.android.support'
    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "3.2"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version = "3.22.1"
        }
    }
    packagingOptions {
        exclude "**/libdobby.so"
    }
}